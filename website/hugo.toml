# Configuration for the setup-block documentation website (GitHub Pages).
# The site is small on purpose: this repository is one composite action, and
# its README is the reference. The pages exist so the action is discoverable
# next to block's own documentation.
baseURL = "https://nao1215.github.io/setup-block/"
locale = "en-us"
title = "setup-block"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true
timeZone = "UTC"

[params]
tagline = "Install the block CLI in GitHub Actions"
description = "GitHub Action that installs the block CLI, caches $BLOCK_HOME on your lockfile, and syncs the blockchain toolchain a project pinned."
repo = "https://github.com/nao1215/setup-block"

[markup.highlight]
noClasses = false

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[[menus.main]]
name = "Usage"
pageRef = "/"
weight = 10

[[menus.main]]
name = "Cookbook"
pageRef = "/cookbook"
weight = 15

[[menus.main]]
name = "Reference"
pageRef = "/reference"
weight = 20

[[menus.main]]
name = "block"
url = "https://nao1215.github.io/block/"
weight = 30

[module]
[[module.mounts]]
source = "content"
target = "content"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "assets"
target = "assets"

# Repository docs, mounted so pages can be generated from the committed files.
[[module.mounts]]
source = "../doc/cookbook.md"
target = "assets/doc/cookbook.md"

# Images served as-is, and mounted again as processable assets so the layouts
# can derive a social card and a favicon at build time.
[[module.mounts]]
source = "../doc/img"
target = "static/img"

[[module.mounts]]
source = "../doc/img"
target = "assets/imgsrc"
