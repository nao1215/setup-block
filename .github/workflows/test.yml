name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static checks — these always run.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck
        # -x lets ShellCheck follow the sourced install.sh from version_test.sh.
        run: shellcheck -x scripts/install.sh scripts/version_test.sh

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Test the install script's helpers
        run: bash scripts/version_test.sh

  # Does a released block exist yet? Until the first release the integration
  # job has nothing to install, and a red badge would say something untrue.
  released:
    name: Check for a published release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view --repo nao1215/block --json tagName >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::nao1215/block has no published release yet; skipping the install job."
          fi

  # Integration test: install block on every supported runner, restore the
  # toolchain cache, and prove the installed toolchain actually runs.
  # `uses: $/` runs this repository's action at the workflow's commit, like
  # `./`, but gh-actions-lock can follow it, so the actions/cache step of
  # action.yml gets the lockfile pin the runner demands.
  install:
    name: Install (${{ matrix.os }})
    needs: released
    if: needs.released.outputs.exists == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup block
        id: setup
        uses: $/
        with:
          version: latest
          working-directory: testdata/project
          sync: "true"

      - name: Print resolved outputs
        shell: bash
        run: |
          echo "version=${{ steps.setup.outputs.version }}"
          echo "bin-path=${{ steps.setup.outputs.bin-path }}"
          echo "install-dir=${{ steps.setup.outputs.install-dir }}"
          echo "block-home=${{ steps.setup.outputs.block-home }}"
          echo "cache-hit=${{ steps.setup.outputs.cache-hit }}"

      - name: block is on PATH and BLOCK_HOME is exported
        shell: bash
        run: |
          block version
          test -n "$BLOCK_HOME"
          test "$BLOCK_HOME" = "${{ steps.setup.outputs.block-home }}"

      - name: The synced toolchain runs
        shell: bash
        working-directory: testdata/project
        run: block exec cometbft version

      # Exactly the line the cookbook tells a reader to write, so this checks
      # the documentation rather than a hand-rolled equivalent of it. The
      # difference is not academic: composing PATH inside the step with
      # "$BLOCK_HOME/shims:$PATH" is wrong on Windows, where $BLOCK_HOME is
      # C:\Users\... and the colon in the drive letter is a PATH separator to
      # bash. One entry per line in $GITHUB_PATH has no such problem.
      - name: Put the shims on PATH, the way the cookbook says to
        shell: bash
        run: echo "$BLOCK_HOME/shims" >> "$GITHUB_PATH"

      - name: The shims run the same toolchain without "block exec"
        shell: bash
        working-directory: testdata/project
        run: cometbft version

      - name: Syncing again is a cache hit and changes nothing
        shell: bash
        working-directory: testdata/project
        run: |
          block sync
          git diff --exit-code block.lock

  # A pinned version must install exactly that release, whether the input has
  # the leading "v" or not, and a custom install-dir must be honoured. The
  # toolchain cache and sync are covered by the install job, so they are off.
  install-pinned:
    name: Install pinned ${{ matrix.version }} (${{ matrix.os }})
    needs: released
    if: needs.released.outputs.exists == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [v0.8.0, 0.8.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup block
        id: setup
        uses: $/
        with:
          version: ${{ matrix.version }}
          install-dir: ${{ runner.temp }}/block-pinned
          cache: "false"

      - name: Verify the pinned release was installed
        shell: bash
        env:
          OUT_VERSION: ${{ steps.setup.outputs.version }}
          OUT_BIN_PATH: ${{ steps.setup.outputs.bin-path }}
          OUT_INSTALL_DIR: ${{ steps.setup.outputs.install-dir }}
          OUT_CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
          WANT_DIR: ${{ runner.temp }}/block-pinned
        run: |
          set -euo pipefail
          test "${OUT_VERSION}" = "v0.8.0" || { echo "version output: ${OUT_VERSION}" >&2; exit 1; }
          # Outputs are native paths (C:\... on Windows); compare in that form.
          want="${WANT_DIR}"
          if command -v cygpath >/dev/null 2>&1; then want="$(cygpath -w "${WANT_DIR}")"; fi
          test "${OUT_INSTALL_DIR}" = "${want}" || { echo "install-dir output: ${OUT_INSTALL_DIR} (want ${want})" >&2; exit 1; }
          test -x "${OUT_BIN_PATH}" || { echo "bin-path is not executable: ${OUT_BIN_PATH}" >&2; exit 1; }
          test -z "${OUT_CACHE_HIT}" || { echo "cache-hit should be empty with cache disabled: ${OUT_CACHE_HIT}" >&2; exit 1; }
          got="$(block version)"
          echo "${got}"
          case "${got}" in
            *0.8.0*) ;;
            *) echo "block on PATH is not v0.8.0" >&2; exit 1 ;;
          esac

  # Inputs that are not a release must fail the step instead of installing
  # something else or succeeding with nothing on PATH. Malformed versions stop
  # before any download; v0.0.0 is well-formed but was never released, so it
  # fails at the download.
  install-reject:
    name: Reject invalid versions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup block, expected to fail: upper-case V"
        id: upper
        continue-on-error: true
        uses: $/
        with:
          version: V0.8.0
          cache: "false"

      - name: "Setup block, expected to fail: doubled v"
        id: doubled
        continue-on-error: true
        uses: $/
        with:
          version: vv0.8.0
          cache: "false"

      - name: "Setup block, expected to fail: missing patch component"
        id: short
        continue-on-error: true
        uses: $/
        with:
          version: "0.8"
          cache: "false"

      - name: "Setup block, expected to fail: a release that was never published"
        id: missing
        continue-on-error: true
        uses: $/
        with:
          version: v0.0.0
          cache: "false"

      - name: Every setup step must have failed and left nothing on PATH
        shell: bash
        env:
          OUTCOME_UPPER: ${{ steps.upper.outcome }}
          OUTCOME_DOUBLED: ${{ steps.doubled.outcome }}
          OUTCOME_SHORT: ${{ steps.short.outcome }}
          OUTCOME_MISSING: ${{ steps.missing.outcome }}
        run: |
          set -euo pipefail
          status=0
          for name in $(compgen -A variable OUTCOME_); do
            if [ "${!name}" = "failure" ]; then
              echo "ok:   ${name#OUTCOME_} failed"
            else
              echo "FAIL: ${name#OUTCOME_} -> ${!name}" >&2
              status=1
            fi
          done
          if command -v block >/dev/null 2>&1; then
            echo "FAIL: block is on PATH after failed installs: $(command -v block)" >&2
            status=1
          fi
          exit "${status}"
